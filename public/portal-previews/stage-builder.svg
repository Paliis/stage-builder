<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Stage Builder preview">
  <defs>
    <linearGradient id="sb-bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="sb-field" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <pattern id="sb-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#86efac" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Background card -->
  <rect x="0" y="0" width="640" height="400" rx="16" fill="url(#sb-bg)"/>

  <!-- Top toolbar -->
  <rect x="20" y="18" width="600" height="36" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="38" cy="36" r="4" fill="#ef4444"/>
  <circle cx="52" cy="36" r="4" fill="#f59e0b"/>
  <circle cx="66" cy="36" r="4" fill="#22c55e"/>
  <rect x="92" y="26" width="80" height="20" rx="6" fill="#eef2ff"/>
  <text x="132" y="40" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#4f46e5">2D plan</text>
  <rect x="180" y="26" width="60" height="20" rx="6" fill="#f1f5f9"/>
  <text x="210" y="40" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">3D</text>
  <rect x="540" y="26" width="64" height="20" rx="6" fill="#4f46e5"/>
  <text x="572" y="40" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">PDF</text>

  <!-- Field -->
  <rect x="40" y="74" width="560" height="296" rx="12" fill="url(#sb-field)" stroke="#86efac"/>
  <rect x="40" y="74" width="560" height="296" rx="12" fill="url(#sb-grid)"/>

  <!-- Ruler ticks (top) -->
  <g stroke="#16a34a" stroke-width="1" opacity="0.7">
    <line x1="40" y1="74" x2="40" y2="82"/>
    <line x1="120" y1="74" x2="120" y2="82"/>
    <line x1="200" y1="74" x2="200" y2="82"/>
    <line x1="280" y1="74" x2="280" y2="82"/>
    <line x1="360" y1="74" x2="360" y2="82"/>
    <line x1="440" y1="74" x2="440" y2="82"/>
    <line x1="520" y1="74" x2="520" y2="82"/>
    <line x1="600" y1="74" x2="600" y2="82"/>
  </g>

  <!-- Walls -->
  <rect x="120" y="120" width="140" height="14" rx="3" fill="#475569"/>
  <rect x="320" y="160" width="160" height="14" rx="3" fill="#475569"/>
  <rect x="200" y="220" width="120" height="14" rx="3" fill="#94a3b8"/>

  <!-- Port (window in wall) -->
  <rect x="178" y="120" width="28" height="14" fill="#dcfce7"/>
  <rect x="380" y="160" width="34" height="14" fill="#dcfce7"/>

  <!-- IPSC targets (cardboard) -->
  <g>
    <rect x="92" y="160" width="22" height="34" rx="3" fill="#fef3c7" stroke="#b45309"/>
    <circle cx="103" cy="174" r="4" fill="#7c2d12"/>
  </g>
  <g>
    <rect x="270" y="195" width="22" height="34" rx="3" fill="#fef3c7" stroke="#b45309"/>
    <circle cx="281" cy="209" r="4" fill="#7c2d12"/>
  </g>
  <g>
    <rect x="500" y="200" width="22" height="34" rx="3" fill="#fef3c7" stroke="#b45309"/>
    <circle cx="511" cy="214" r="4" fill="#7c2d12"/>
  </g>

  <!-- No-Shoot -->
  <rect x="430" y="220" width="22" height="34" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>

  <!-- Steel popper -->
  <circle cx="160" cy="290" r="9" fill="#cbd5e1" stroke="#64748b"/>
  <line x1="160" y1="299" x2="160" y2="320" stroke="#64748b" stroke-width="2"/>

  <!-- Shooter position -->
  <g>
    <circle cx="320" cy="330" r="14" fill="#4f46e5" opacity="0.15"/>
    <polygon points="320,316 332,344 320,338 308,344" fill="#4f46e5"/>
  </g>

  <!-- Measurement line -->
  <g stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4 3">
    <line x1="320" y1="330" x2="103" y2="178"/>
  </g>
  <rect x="190" y="244" width="56" height="20" rx="10" fill="#0ea5e9"/>
  <text x="218" y="258" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">12.4 m</text>
</svg>
